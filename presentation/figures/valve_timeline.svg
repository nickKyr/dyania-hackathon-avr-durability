<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="690" viewBox="0 0 1680 690" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="1680" height="690" fill="#fcfcfb"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0b0b0b">How one valve becomes training rows</text>
<text x="40" y="82" font-size="16" fill="#52514e">A checkpoint splits a valve's history into what the model may use and what it must predict.</text>
<line x1="120" y1="300" x2="1560" y2="300" stroke="#52514e" stroke-width="3"/>
<line x1="120.0" y1="292" x2="120.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="120.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">0</text>
<line x1="264.0" y1="292" x2="264.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="264.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">1</text>
<line x1="408.0" y1="292" x2="408.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="408.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">2</text>
<line x1="552.0" y1="292" x2="552.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="552.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">3</text>
