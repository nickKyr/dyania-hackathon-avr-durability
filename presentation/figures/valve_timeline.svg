<line x1="984.0" y1="292" x2="984.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="984.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">6</text>
<line x1="1128.0" y1="292" x2="1128.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="1128.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">7</text>
<line x1="1272.0" y1="292" x2="1272.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="1272.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">8</text>
<line x1="1416.0" y1="292" x2="1416.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="1416.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">9</text>
<line x1="1560.0" y1="292" x2="1560.0" y2="308" stroke="#52514e" stroke-width="2"/>
<text x="1560.0" y="332" font-size="14" fill="#52514e" text-anchor="middle">10</text>
<text x="840.0" y="362" font-size="15" fill="#52514e" text-anchor="middle">years since implant</text>
<rect x="120.0" y="150" width="432.0" height="120" rx="8" fill="#eef4fc" stroke="#2a78d6" stroke-dasharray="6 5"/>
<text x="134.0" y="178" font-size="15" font-weight="700" fill="#2a78d6">features: only what is known by year 3</text>
<text x="134.0" y="202" font-size="14" fill="#52514e">echoes, change since the first echo,</text>
<text x="134.0" y="222" font-size="14" fill="#52514e">patient and valve details</text>
<rect x="552.0" y="150" width="720.0" height="120" rx="8" fill="#fdf0ea" stroke="#eb6834" stroke-dasharray="6 5"/>
<text x="566.0" y="178" font-size="15" font-weight="700" fill="#eb6834">labels: what happens in the next 2, 5 and 8 years</text>
<text x="566.0" y="202" font-size="14" fill="#52514e">failure, death first, or follow-up ending early</text>
<line x1="552.0" y1="130" x2="552.0" y2="310" stroke="#0b0b0b" stroke-width="3"/>
<text x="552.0" y="120" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">checkpoint at year 3</text>
<circle cx="120.0" cy="300" r="9" fill="#898781" stroke="#fcfcfb" stroke-width="3"/>
<circle cx="141.6" cy="300" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/>
<circle cx="264.0" cy="300" r="9" fill="#2a78d6" stroke="#fcfcfb" stroke-width="3"/>
