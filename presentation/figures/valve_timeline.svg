<circle cx="1185.6" cy="300" r="9" fill="#eb6834" stroke="#fcfcfb" stroke-width="3"/>
<text x="120.0" y="410" font-size="14" fill="#898781" text-anchor="middle">implant</text>
<line x1="120.0" y1="370" x2="120.0" y2="394" stroke="#e1e0d9" stroke-width="1"/>
<text x="141.6" y="440" font-size="14" fill="#2a78d6" text-anchor="middle">first echo</text>
<line x1="141.6" y1="370" x2="141.6" y2="424" stroke="#e1e0d9" stroke-width="1"/>
<text x="264.0" y="410" font-size="14" fill="#2a78d6" text-anchor="middle">echo</text>
<line x1="264.0" y1="370" x2="264.0" y2="394" stroke="#e1e0d9" stroke-width="1"/>
<text x="552.0" y="440" font-size="14" fill="#2a78d6" text-anchor="middle">echo</text>
<line x1="552.0" y1="370" x2="552.0" y2="424" stroke="#e1e0d9" stroke-width="1"/>
<text x="984.0" y="410" font-size="14" fill="#2a78d6" text-anchor="middle">echo: normal</text>
<line x1="984.0" y1="370" x2="984.0" y2="394" stroke="#e1e0d9" stroke-width="1"/>
<text x="1185.6" y="440" font-size="14" fill="#eb6834" text-anchor="middle">echo: failure found</text>
<line x1="1185.6" y1="370" x2="1185.6" y2="424" stroke="#e1e0d9" stroke-width="1"/>
<rect x="984.0" y="282" width="201.5999999999999" height="36" rx="6" fill="#eb6834" opacity="0.18"/>
<text x="1084.8" y="362" font-size="14" fill="#eb6834" text-anchor="middle">failure happened in this gap</text>
<rect x="120" y="560" width="460" height="100" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="136" y="588" font-size="17" font-weight="700" fill="#0b0b0b">One valve, many rows</text>
<text x="136" y="612" font-size="14" fill="#52514e">a row at 0.5, 1, 2, 3 ... years while the</text>
<text x="136" y="632" font-size="14" fill="#52514e">valve is still working and followed</text>
<rect x="610" y="560" width="460" height="100" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="626" y="588" font-size="17" font-weight="700" fill="#0b0b0b">No peeking</text>
<text x="626" y="612" font-size="14" fill="#52514e">nothing recorded after the checkpoint</text>
<text x="626" y="632" font-size="14" fill="#52514e">enters the row</text>
<rect x="1100" y="560" width="460" height="100" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="1116" y="588" font-size="17" font-weight="700" fill="#0b0b0b">Death competes</text>
<text x="1116" y="612" font-size="14" fill="#52514e">a patient who dies first counts as</text>
<text x="1116" y="632" font-size="14" fill="#52514e">not failing, not as lost</text>
</svg>