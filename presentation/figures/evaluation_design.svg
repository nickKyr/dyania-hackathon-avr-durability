<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="530" viewBox="0 0 1760 530" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="1760" height="530" fill="#fcfcfb"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0b0b0b">How models are checked</text>
<text x="40" y="82" font-size="16" fill="#52514e">Trained on simulated patients, tested on later simulated valves, then scored on the real extract.</text>
<rect x="40" y="130" width="520" height="170" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56" y="158" font-size="17" font-weight="700" fill="#0b0b0b">Train</text>
<text x="56" y="182" font-size="14" fill="#52514e">simulated valves implanted up to 2018</text>
<text x="56" y="202" font-size="14" fill="#52514e">reshaped like the real extract</text>
<text x="56" y="222" font-size="14" fill="#52514e">tuning: 3-fold cross-validation,</text>
<text x="56" y="242" font-size="14" fill="#52514e">folds split by patient</text>
<rect x="620" y="130" width="520" height="170" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="636" y="158" font-size="17" font-weight="700" fill="#0b0b0b">Test on later valves</text>
<text x="636" y="182" font-size="14" fill="#52514e">simulated valves implanted after 2018</text>
<text x="636" y="202" font-size="14" fill="#52514e">never seen in training</text>
<text x="636" y="222" font-size="14" fill="#52514e">shows how the method behaves</text>
<text x="636" y="242" font-size="14" fill="#52514e">on future patients</text>
<rect x="1200" y="130" width="520" height="170" rx="10" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.5"/>
<text x="1216" y="158" font-size="17" font-weight="700" fill="#0b0b0b">Score the real extract</text>
<text x="1216" y="182" font-size="14" fill="#52514e">51 real valves, 8 failures, no deaths</text>
<text x="1216" y="202" font-size="14" fill="#52514e">never used for training</text>
<text x="1216" y="222" font-size="14" fill="#52514e">patient-level bootstrap intervals</text>
<text x="1216" y="242" font-size="14" fill="#52514e">(few events, wide intervals)</text>
<line x1="560" y1="215" x2="618" y2="215" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<line x1="1140" y1="215" x2="1198" y2="215" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="40" y="380" width="400" height="110" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="56" y="408" font-size="17" font-weight="700" fill="#0b0b0b">Ranking</text>
<text x="56" y="432" font-size="14" fill="#52514e">competing-risk AUC at 2, 5, 8 years</text>
<text x="56" y="452" font-size="14" fill="#52514e">and concordance</text>
<rect x="465" y="380" width="400" height="110" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="481" y="408" font-size="17" font-weight="700" fill="#0b0b0b">Accuracy of risks</text>
<text x="481" y="432" font-size="14" fill="#52514e">Brier score, predicted</text>
<text x="481" y="452" font-size="14" fill="#52514e">against observed incidence</text>
<rect x="890" y="380" width="400" height="110" rx="10" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.5"/>
<text x="906" y="408" font-size="17" font-weight="700" fill="#0b0b0b">Clinical value</text>
<text x="906" y="432" font-size="14" fill="#52514e">decision curve, risk tiers</text>
<text x="906" y="452" font-size="14" fill="#52514e">and what they catch</text>
<rect x="1315" y="380" width="400" height="110" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="1331" y="408" font-size="17" font-weight="700" fill="#0b0b0b">Tracking</text>
<text x="1331" y="432" font-size="14" fill="#52514e">every run logged,</text>
<text x="1331" y="452" font-size="14" fill="#52514e">runs compared side by side</text>
</svg>