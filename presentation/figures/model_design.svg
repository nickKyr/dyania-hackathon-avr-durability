<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="760" viewBox="0 0 1880 760" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect width="1880" height="760" fill="#fcfcfb"/>
<text x="40" y="52" font-size="28" font-weight="700" fill="#0b0b0b">The primary model</text>
<text x="40" y="82" font-size="16" fill="#52514e">Discrete-time competing risks: two yearly hazards chained into the chance of failure before death.</text>
<rect x="40" y="130" width="300" height="250" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="56" y="158" font-size="17" font-weight="700" fill="#0b0b0b">One checkpoint row</text>
<text x="56" y="182" font-size="14" fill="#52514e">a valve at a visit</text>
<text x="56" y="202" font-size="14" fill="#52514e">41 features known then</text>
<text x="56" y="222" font-size="14" fill="#52514e">valve age, patient, valve,</text>
<text x="56" y="242" font-size="14" fill="#52514e">echo history, surveillance</text>
<rect x="400" y="130" width="300" height="250" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="416" y="158" font-size="13" font-weight="700" fill="#2a78d6">expand</text>
<text x="416" y="180" font-size="17" font-weight="700" fill="#0b0b0b">One row per year after</text>
<text x="416" y="204" font-size="14" fill="#52514e">year 1, year 2, ... year 8</text>
<text x="416" y="224" font-size="14" fill="#52514e">labelled nothing, failure</text>
<text x="416" y="244" font-size="14" fill="#52514e">or death; censored rows</text>
<text x="416" y="264" font-size="14" fill="#52514e">keep only observed years</text>
<rect x="760" y="110" width="330" height="130" rx="10" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<text x="776" y="138" font-size="17" font-weight="700" fill="#0b0b0b">Failure hazard</text>
<text x="776" y="162" font-size="14" fill="#52514e">chance of failure in year k,</text>
<text x="776" y="182" font-size="14" fill="#52514e">gradient boosting, constrained</text>
<rect x="760" y="270" width="330" height="130" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="776" y="298" font-size="17" font-weight="700" fill="#0b0b0b">Death hazard</text>
<text x="776" y="322" font-size="14" fill="#52514e">chance of death in year k,</text>
<text x="776" y="342" font-size="14" fill="#52514e">same structure, unconstrained</text>
<rect x="1150" y="130" width="330" height="250" rx="10" fill="#eef4fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1166" y="158" font-size="13" font-weight="700" fill="#2a78d6">competing risks</text>
<text x="1166" y="180" font-size="17" font-weight="700" fill="#0b0b0b">Chain the years</text>
<text x="1166" y="204" font-size="14" fill="#52514e">still event-free at k:</text>
<text x="1166" y="224" font-size="14" fill="#52514e">product of (1 minus both hazards)</text>
<text x="1166" y="244" font-size="14" fill="#52514e">risk by year k adds</text>
<text x="1166" y="264" font-size="14" fill="#52514e">event-free share times failure hazard</text>
<rect x="1540" y="130" width="300" height="250" rx="10" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.5"/>
<text x="1556" y="158" font-size="17" font-weight="700" fill="#0b0b0b">Output</text>
<text x="1556" y="182" font-size="14" fill="#52514e">risk within 2, 5, 8 years</text>
<text x="1556" y="202" font-size="14" fill="#52514e">tier: under 5%, 5 to 15%,</text>
<text x="1556" y="222" font-size="14" fill="#52514e">15% or more</text>
<text x="1556" y="242" font-size="14" fill="#52514e">next echo interval</text>
<line x1="340" y1="255" x2="398" y2="255" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M 700 225 L 730 225 L 730 175 L 758 175" fill="none" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M 700 285 L 730 285 L 730 335 L 758 335" fill="none" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M 1090 175 L 1120 175 L 1120 225 L 1148 225" fill="none" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M 1090 335 L 1120 335 L 1120 285 L 1148 285" fill="none" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<line x1="1480" y1="255" x2="1538" y2="255" stroke="#c3c2b7" stroke-width="2.2" marker-end="url(#head)"/>
<rect x="40" y="450" width="560" height="140" rx="10" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<text x="56" y="478" font-size="17" font-weight="700" fill="#0b0b0b">Monotone constraints</text>
<text x="56" y="502" font-size="14" fill="#52514e">a higher gradient, a faster rise or an older valve</text>
<text x="56" y="522" font-size="14" fill="#52514e">can never lower predicted risk; a higher DVI or</text>
<text x="56" y="542" font-size="14" fill="#52514e">valve area can never raise it</text>
<rect x="640" y="450" width="560" height="140" rx="10" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
<text x="656" y="478" font-size="17" font-weight="700" fill="#0b0b0b">Why death is modelled</text>
<text x="656" y="502" font-size="14" fill="#52514e">elderly patients often die with a working valve;</text>
<text x="656" y="522" font-size="14" fill="#52514e">ignoring that inflates risk (the Cox comparator</text>
<text x="656" y="542" font-size="14" fill="#52514e">predicted 34% at 8 years against 20.5% observed)</text>
<rect x="1240" y="450" width="600" height="140" rx="10" fill="#e9f7f1" stroke="#1baf7a" stroke-width="1.5"/>
<text x="1256" y="478" font-size="17" font-weight="700" fill="#0b0b0b">Explaining each prediction</text>
<text x="1256" y="502" font-size="14" fill="#52514e">SHAP values of the failure hazard give the</text>
<text x="1256" y="522" font-size="14" fill="#52514e">features that raised or lowered this patient's</text>
<text x="1256" y="542" font-size="14" fill="#52514e">risk; the top three are shown to the clinician</text>
<rect x="40" y="630" width="1800" height="90" rx="10" fill="#f3f3f0" stroke="#898781" stroke-width="1.5"/>
<text x="56" y="658" font-size="17" font-weight="700" fill="#0b0b0b">Compared against</text>
<text x="56" y="682" font-size="14" fill="#52514e">calendar schedule (current practice)  ·  valve age only  ·  Cox on published risk factors  ·  regression with the same two-hazard structure on 10 clinical priors</text>
</svg>