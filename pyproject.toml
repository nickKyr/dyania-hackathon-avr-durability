[project]
name = "dyania-hackathon-avr-durability"
version = "0.1.0"
description = "Predicting bioprosthetic aortic valve durability: study protocol, abstraction pipeline and competing-risk model (Dyania Health Hackathon 2026, team dyanooumenoi)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lifelines>=0.30.0",
    "markdown>=3.10.3",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that take more than a few seconds to run",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"notebooks/pipeline/prep.py" = ["B023"]
